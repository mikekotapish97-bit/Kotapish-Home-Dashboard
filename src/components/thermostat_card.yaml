# =============================================================================
# Component: Honeywell T6 Pro Thermostat (compact, native dial)
# Real entity: climate.t6_pro
#
# Uses Home Assistant's native `type: thermostat` card — the circular
# rotary-dial temperature control — instead of Mushroom's climate card, to
# match the reference dashboard's thermostat widget. It already inherits
# the glass background/blur/radius from the theme's global card-mod hook
# (theme/kotapish_glass.yaml), same as every other card in this project —
# no extra styling needed here.
#
# One of three equal-width cards in pages/home.yaml's main section row
# (camera | weather | thermostat), sized to fit a single 12.9" iPad screen
# with no scrolling. The full thermostat controls + 24h history graph live
# on pages/climate.yaml, which has the vertical room for them.
# =============================================================================

type: thermostat
grid_options:
  columns: full
entity: climate.t6_pro
name: Thermostat
