# =============================================================================
# Component: Honeywell T6 Pro Thermostat + Home Status
# Real entity: climate.t6_pro
# Mushroom climate card for the compact Home-page placement; the full
# thermostat dial + graphs live on pages/climate.yaml.
#
# Bundles the Home Status row (components/home_status_card.yaml) as its
# last card so pages/home.yaml can include this ONE component directly as
# a horizontal-stack sibling of the camera card, with no extra wrapping
# vertical-stack in between. That extra nesting level (horizontal-stack >
# vertical-stack > this-file's-own-vertical-stack > mini-graph-card) was
# one level deeper than the working graphs on pages/climate.yaml, which is
# a known trigger for chart cards computing a collapsed/zero width before
# a nested flex layout has finished settling.
# =============================================================================

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Thermostat
    subtitle: Honeywell T6 Pro
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; padding: 4px 4px 0 4px; }
        .primary { font-family: var(--kotapish-font-family); font-weight: 700; font-size: 20px; }
        .secondary { font-family: var(--kotapish-font-family); color: var(--secondary-text-color); }

  - type: custom:mushroom-climate-card
    entity: climate.t6_pro
    show_temperature_control: true
    hvac_modes:
      - heat
      - cool
      - heat_cool
      - "off"
    collapsible_controls: false
    card_mod:
      style: |
        ha-card {
          --mush-control-height: 56px;
          padding: 18px 20px;
        }
        mushroom-shape-icon {
          --icon-color: var(--kotapish-orange);
          --shape-color: rgba(255, 159, 10, 0.14);
        }

  # ---------------------------------------------------------------------------
  # Single-line current-temperature trend. Deliberately does NOT also graph
  # the `temperature` (setpoint) attribute here: that attribute doesn't
  # exist while a climate entity is in heat_cool/auto mode (it uses
  # target_temp_low/target_temp_high instead), which would silently break
  # this card. current_temperature is always present. The full breakdown
  # (current + humidity) lives on pages/climate.yaml, which only ever
  # graphs attributes guaranteed to exist.
  # ---------------------------------------------------------------------------
  - type: custom:mini-graph-card
    cache: false
    entities:
      - entity: climate.t6_pro
        attribute: current_temperature
        name: Current
        color: var(--kotapish-blue)
    hours_to_show: 24
    points_per_hour: 2
    line_width: 3
    show:
      labels: false
      legend: false
      name: false
      icon: false
    card_mod:
      style: |
        ha-card { padding: 8px 16px 12px 16px; }

  - !include ../components/home_status_card.yaml
