  - type: custom:button-card
    template: kotapish_nav_icon
    variables:
      path: commercial-hvac
    icon: mdi:hvac
    label: BAS
    tap_action:
      action: navigate
      navigation_path: /kotapish-home/commercial-hvac

  - type: custom:button-card
    template: kotapish_nav_icon
