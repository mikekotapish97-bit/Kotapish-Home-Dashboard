    variables:
      path: lighting
    icon: mdi:lightbulb
    label: Lighting
    tap_action:
      action: navigate
      navigation_path: /kotapish-home/lighting

  - type: custom:button-card
    template: kotapish_nav_icon
    variables:
      path: security
    icon: mdi:shield-home
    label: Security
    tap_action:
      action: navigate
      navigation_path: /kotapish-home/security

  - type: custom:button-card
    template: kotapish_nav_icon
    variables:
      path: energy
    icon: mdi:lightning-bolt
    label: Energy
    tap_action:
      action: navigate
      navigation_path: /kotapish-home/energy

  - type: custom:button-card
    template: kotapish_nav_icon
    variables:
      path: media
    icon: mdi:play-circle
    label: Media
    tap_action:
      action: navigate
