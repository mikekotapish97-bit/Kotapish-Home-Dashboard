# =============================================================================
# Component: Rooms List (Home page)
# Matches the reference dashboard's "Rooms" card structure per row: a
# colored icon badge, the room name, an orange light-count pill, and the
# room temperature — as three distinct visual elements, not one combined
# text string. Tapping a row opens the same Browser Mod room popups
# already built in src/popups/room_*.yaml. This is a browse/info list,
# distinct from components/shortcuts_card.yaml (quick action toggles).
#
# Uses the kotapish_room_row template (a standalone glass row, normal
# document flow — see templates/button_card_templates.yaml for why it's
# built that way). All light/temperature entities are PLACEHOLDERS — see
# the popups for full lists.
# =============================================================================

type: vertical-stack
grid_options:
  columns: full
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - padding: 4px 4px 0 4px
        - align-items: flex-start
    name: Rooms

  - type: custom:button-card
    template: kotapish_room_row
    icon: mdi:sofa
    name: Living Room
    variables:
      badge_color: var(--kotapish-blue)
    # PLACEHOLDER ENTITIES: light.living_room_placeholder, sensor.living_room_temp_placeholder
    custom_fields:
      info: |
        [[[
          const light = states['light.living_room_placeholder'];
          const temp = states['sensor.living_room_temp_placeholder'];
          const on = (light && light.state === 'on') ? 1 : 0;
          const tempText = temp ? `${temp.state}°` : '--';
          return `<div style="display:flex; align-items:center; gap:8px; font-family: var(--kotapish-font-family);">
            <span style="display:flex; align-items:center; gap:3px; background: var(--kotapish-orange); color:white; border-radius:12px; padding:2px 8px; font-size:12px; font-weight:600;">💡 ${on}</span>
            <span style="font-size:13px; color: var(--secondary-text-color); min-width: 34px; text-align:right;">${tempText}</span>
          </div>`;
        ]]]
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Living Room
          size: wide
          style: |
            .mdc-dialog__surface { border-radius: 30px !important; backdrop-filter: blur(30px); }
          content: !include ../popups/room_living_room.yaml

