# =============================================================================
# Component: Rooms List (Home page)
# Compact list matching the reference dashboard's "Rooms" card: icon, room
# name, and a combined lights/temperature status per row. Tapping a row
# opens the same Browser Mod room popups already built in
# src/popups/room_*.yaml — this replaces components/room_tiles.yaml's grid
# on the Home page with a denser list shape; room_tiles.yaml itself is kept
# unreferenced (see its header comment) in case a future layout wants tiles
# back instead of a list.
#
# Uses the kotapish_list_row template (a standalone glass row, normal
# document flow — see templates/button_card_templates.yaml for why it's
# built that way). All light/temperature entities are PLACEHOLDERS — see
# the popups for full lists.
# =============================================================================

type: vertical-stack
grid_options:
  columns: full
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - padding: 4px 4px 0 4px
        - align-items: flex-start
    name: Rooms

  - type: custom:button-card
    template: kotapish_list_row
    icon: mdi:sofa
    name: Living Room
    state_display: |
      [[[
        const light = states['light.living_room_placeholder'];
        const temp = states['sensor.living_room_temp_placeholder'];
        const lightText = (light && light.state === 'on') ? 'Lights on' : 'Lights off';
        return temp ? `${lightText} · ${temp.state}°` : lightText;
      ]]]
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Living Room
          size: wide
          style: |
            .mdc-dialog__surface { border-radius: 28px !important; backdrop-filter: blur(30px); }
          content: !include ../popups/room_living_room.yaml

