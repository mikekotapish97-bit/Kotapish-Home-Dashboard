# =============================================================================
# Component: Weather Forecast Card (Home page)
#
# Ported from the reference dashboard's actual weather widget structure:
# icon + big temperature side by side, condition + high/low below that,
# then a 4-day forecast strip. The reference pulls icon/temp/condition/
# hi-lo from individual Australian BOM sensor entities (not the weather
# entity's own attributes) — kept the same per-sensor structure here,
# pointed at placeholder sensors, since NWS/HA's modern weather entities
# don't expose daily high/low as plain attributes either (that data comes
# through the `weather.get_forecasts` service, which only cards built to
# call it — like the native `weather-forecast` card below — can use
# directly; a button-card JS template can't call a service).
#
# The 4-day forecast strip uses the real weather.ranson_wv_nws entity via
# HA's native `type: weather-forecast` card (same as the reference), since
# that part maps cleanly to this project's actual NWS integration.
#
# PLACEHOLDER ENTITIES: sensor.ranson_wv_temp_placeholder,
# sensor.ranson_wv_condition_placeholder, sensor.ranson_wv_temp_max_placeholder,
# sensor.ranson_wv_temp_min_placeholder
# Real entity (once set up — see INSTALLATION.md step 8): weather.ranson_wv_nws
# =============================================================================

type: custom:button-card
grid_options:
  columns: full
show_name: false
show_icon: false
show_state: false
styles:
  grid:
    - grid-template-areas: '"current" "forecast" "strip"'
  card:
    - padding: 16px 20px 8px 20px
custom_fields:
  current: |
    [[[
      // Maps the condition text to an icon rather than expecting a sensor
      // to literally store an icon name (non-standard) — condition strings
      // like "Cloudy"/"Sunny"/"Rain" are what a real weather sensor
      // actually reports.
      const iconMap = {
        clear: 'mdi:weather-sunny', sunny: 'mdi:weather-sunny',
        cloudy: 'mdi:weather-cloudy', 'partly-cloudy': 'mdi:weather-partly-cloudy',
        rainy: 'mdi:weather-rainy', rain: 'mdi:weather-rainy',
        snowy: 'mdi:weather-snowy', snow: 'mdi:weather-snowy',
        fog: 'mdi:weather-fog', windy: 'mdi:weather-windy',
        thunderstorm: 'mdi:weather-lightning'
      };
      const cond = states['sensor.ranson_wv_condition_placeholder'];
      const condKey = cond ? cond.state.toLowerCase() : '';
      const icon = iconMap[condKey] || 'mdi:weather-cloudy';
      const temp = states['sensor.ranson_wv_temp_placeholder'];
      return `<div style="display:flex; align-items:center; justify-content:space-between; font-family: var(--kotapish-font-family);">
        <ha-icon icon="${icon}" style="width:50px; height:50px; color: var(--kotapish-blue);"></ha-icon>
        <span style="font-size:55px; font-weight:500; color: var(--primary-text-color); font-family: var(--kotapish-font-family);">${temp ? Math.round(temp.state) : '--'}°</span>
      </div>`;
    ]]]
  forecast: |
    [[[
      const cond = states['sensor.ranson_wv_condition_placeholder'];
      const hi = states['sensor.ranson_wv_temp_max_placeholder'];
      const lo = states['sensor.ranson_wv_temp_min_placeholder'];
      return `<div style="text-align:center; font-family: var(--kotapish-font-family); margin: 8px 0;">
        <div style="font-size:22px; font-weight:550; color: var(--primary-text-color);">${cond ? cond.state : 'Unknown'}.</div>
        <div style="font-size:15px; font-weight:450; color: var(--secondary-text-color); text-transform:uppercase; margin-top:6px;">
          HIGH ${hi ? Math.round(hi.state) : '--'}°  LOW ${lo ? Math.round(lo.state) : '--'}°
        </div>
      </div>`;
    ]]]
  strip:
    card:
      type: weather-forecast
      entity: weather.ranson_wv_nws # PLACEHOLDER ENTITY (set up NWS — see INSTALLATION.md step 8)
      show_current: false
      show_forecast: true
      forecast_type: daily
      card_mod:
        style: |
          ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; padding: 0; font-family: var(--kotapish-font-family); }
