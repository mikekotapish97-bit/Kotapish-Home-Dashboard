# =============================================================================
# Component: Weather Forecast Card (Home page)
# Clock Weather Card, configured WITHOUT its own clock (`hide_clock: true`)
# since the Home page's header (components/header.yaml) already has one —
# this card exists purely to show current conditions + the full daily/
# weekly forecast list. The Climate page's components/weather_card.yaml is
# a separate instance that DOES show its own clock (no conflict there).
#
# PLACEHOLDER ENTITY: weather.ranson_wv_nws
# Set up Settings → Devices & Services → Add Integration → "National
# Weather Service (NWS)" for Ranson, WV, then replace this with the real
# entity_id it creates (check Developer Tools → States, or rename it to
# match via the entity's Settings → Advanced → Entity ID). See
# INSTALLATION.md step 8 for the full walkthrough.
# =============================================================================

type: custom:clock-weather-card
entity: weather.ranson_wv_nws # PLACEHOLDER ENTITY
sun_entity: sun.sun
hide_clock: true
hide_today_section: false
hide_forecast_section: false
hourly_forecast: false
forecast_rows: 7
name: Ranson, WV
card_mod:
  style: |
    ha-card {
      padding: 20px 24px;
    }
    .date {
      font-family: var(--kotapish-font-family) !important;
      color: var(--secondary-text-color) !important;
    }
    .weather-icon svg {
      filter: drop-shadow(0 4px 10px rgba(10, 132, 255, 0.25));
    }
