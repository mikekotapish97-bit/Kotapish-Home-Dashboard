        ]]]
    tap_action:
      action: call-service
      service: light.toggle
      service_data:
        entity_id: light.kitchen_placeholder

  - type: custom:button-card
    template: kotapish_status_chip
    entity: light.bedroom_placeholder # PLACEHOLDER ENTITY
    icon: mdi:bed
    name: Bedroom
    show_state: false
    variables:
      chip_color: |
        [[[
          const s = states['light.bedroom_placeholder'];
          return (s && s.state === 'on') ? 'var(--kotapish-yellow)' : 'var(--kotapish-blue)';
        ]]]
    tap_action:
      action: call-service
      service: light.toggle
      service_data:
        entity_id: light.bedroom_placeholder

  - type: custom:button-card
