# =============================================================================
# Component: Top Bar
# Rebuilt to match the reference dashboard's actual top row: small status
# pills on the left, a big clock (with a small seconds readout) on the
# right of them, and a circular icon on the far right. The reference's own
# pills are personal-life trackers (baby sleep monitor, washing machine,
# work meeting status, 3D printer) this project has no equivalent for —
# repurposed here with Garage/Locks/Alarm/Internet status instead, in the
# exact same pill shape/size. Its "avatar" pair (person-tracker photos) has
# no equivalent either — replaced with the notifications bell, since this
# project has no person-tracking entities.
#
# All entities below are PLACEHOLDERS except noted.
# =============================================================================

type: horizontal-stack
grid_options:
  columns: full
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:garage
    name: Garage
    # PLACEHOLDER ENTITY
    label: |
      [[[
        const s = states['cover.garage_door_placeholder'];
        return (s && s.state === 'closed') ? 'Closed' : 'Open';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['cover.garage_door_placeholder'];
          return (s && s.state === 'closed') ? 'var(--kotapish-green)' : 'var(--kotapish-orange)';
        ]]]
    tap_action:
      action: more-info
      entity: cover.garage_door_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:lock
    name: Locks
    # PLACEHOLDER ENTITY
    label: |
      [[[
        const s = states['lock.front_door_placeholder'];
        return (s && s.state === 'locked') ? 'Locked' : 'Unlocked';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['lock.front_door_placeholder'];
          return (s && s.state === 'locked') ? 'var(--kotapish-green)' : 'var(--kotapish-red)';
        ]]]
    tap_action:
      action: more-info
      entity: lock.front_door_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:shield-home
    name: Alarm
    # PLACEHOLDER ENTITY
    label: |
      [[[
        const s = states['alarm_control_panel.home_alarm_placeholder'];
        return s ? s.state.replace('_', ' ') : 'Unknown';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['alarm_control_panel.home_alarm_placeholder'];
          return (s && s.state === 'armed_away') ? 'var(--kotapish-green)' : 'var(--kotapish-orange)';
        ]]]
    tap_action:
      action: more-info
      entity: alarm_control_panel.home_alarm_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:web
    name: Internet
    # PLACEHOLDER ENTITY
    label: |
      [[[
        const s = states['binary_sensor.internet_connection_placeholder'];
        return (s && s.state === 'on') ? 'Online' : 'Offline';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['binary_sensor.internet_connection_placeholder'];
          return (s && s.state === 'on') ? 'var(--kotapish-green)' : 'var(--kotapish-red)';
        ]]]
    tap_action:
      action: navigate
      navigation_path: /kotapish-home/network

  # ---------------------------------------------------------------------------
  # Spacer — pushes the clock + bell to the right, matching the reference's
  # pills-left / clock-and-avatars-right arrangement
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - flex: "1"
        - background: transparent
        - box-shadow: none
        - border: none
        - backdrop-filter: none

  # ---------------------------------------------------------------------------
  # Live clock — big numerals with a small live seconds readout, matching
  # the reference's "15:24" + small superscript seconds
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - flex: "0 0 auto"
        - align-items: center
        - justify-content: center
        - padding: 12px 24px
        - background: transparent
        - box-shadow: none
        - border: none
        - backdrop-filter: none
    custom_fields:
      clock: |
        [[[
          const now = new Date();
          const time = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
          const seconds = now.getSeconds().toString().padStart(2, '0');
          return `<div style="font-family: var(--kotapish-font-family); display: flex; align-items: flex-start;">
            <span style="font-size: 34px; font-weight: 700; letter-spacing: -1px; color: var(--primary-text-color);">${time}</span>
            <span style="font-size: 14px; font-weight: 600; color: var(--secondary-text-color); margin-top: 2px;">${seconds}</span>
          </div>`;
        ]]]

  # ---------------------------------------------------------------------------
  # Notifications bell — stands in for the reference's person-avatar pair
  # (this project has no person-tracking entities). Opens HA's
  # persistent_notification panel via more-info.
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_header_icon_button
    icon: mdi:bell-outline
    styles:
      card:
        - flex: "0 0 auto"
        - margin: 0 8px
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Notifications
          size: normal
          content:
            type: entities
            entities:
              - entity: persistent_notification.placeholder # PLACEHOLDER ENTITY
                name: System Notifications
