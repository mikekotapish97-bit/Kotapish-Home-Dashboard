# =============================================================================
# Component: Top Bar
# Ported from the reference dashboard's actual top row: 4 personal-life
# status pills, a big clock with a live seconds readout, then a
# person-avatar pair, then a notifications bell. This project has no
# equivalent devices for the reference's own pills (a baby-monitor sleep
# tracker, a washing machine sensor, a work-meeting calendar sync, a 3D
# printer) or its person-tracker avatars — per explicit instruction, these
# are kept with the reference's exact pill/avatar code and sizing, pointed
# at clearly marked placeholder entities, ready to wire up if/when
# equivalent devices exist. Garage/Locks/Alarm/Internet status (this
# project's own earlier stand-ins for this row) moved off the top bar —
# they're still reachable via Shortcuts (Garage) and the Security page.
#
# All entities below are PLACEHOLDERS.
# =============================================================================

type: horizontal-stack
grid_options:
  columns: full
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:sleep
    name: |
      [[[
        const s = states['input_boolean.person_asleep_placeholder'];
        return (s && s.state === 'on') ? 'Asleep' : 'Awake';
      ]]]
    # PLACEHOLDER ENTITIES: input_boolean.person_asleep_placeholder, sensor.person_asleep_or_awake_since_placeholder
    label: |
      [[[
        const since = states['sensor.person_asleep_or_awake_since_placeholder'];
        return since ? `Since ${since.state}` : 'Unknown';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['input_boolean.person_asleep_placeholder'];
          return (s && s.state === 'on') ? 'var(--kotapish-green)' : 'var(--kotapish-blue)';
        ]]]
    tap_action:
      action: more-info
      entity: input_boolean.person_asleep_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:washing-machine
    name: Washing Machine
    # PLACEHOLDER ENTITY: sensor.washing_machine_placeholder
    label: |
      [[[
        const s = states['sensor.washing_machine_placeholder'];
        return s ? s.state : 'Unknown';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['sensor.washing_machine_placeholder'];
          return (s && s.state === 'Finished') ? 'var(--kotapish-red)' : 'var(--kotapish-blue)';
        ]]]
    tap_action:
      action: more-info
      entity: sensor.washing_machine_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:calendar-account
    name: |
      [[[
        const s = states['sensor.person_meeting_status_placeholder'];
        return (s && s.state === 'on') ? 'In Meeting' : 'Free';
      ]]]
    # PLACEHOLDER ENTITY: sensor.person_meeting_status_placeholder
    label: |
      [[[
        const s = states['sensor.person_meeting_status_placeholder'];
        return (s && s.attributes && s.attributes.location) ? s.attributes.location : '';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['sensor.person_meeting_status_placeholder'];
          return (s && s.state === 'on') ? 'var(--kotapish-orange)' : 'var(--kotapish-green)';
        ]]]
    tap_action:
      action: more-info
      entity: sensor.person_meeting_status_placeholder

  - type: custom:button-card
    template: kotapish_top_pill
    icon: mdi:printer-3d
    name: |
      [[[
        const s = states['sensor.printer_status_placeholder'];
        return s ? s.state : 'Printer';
      ]]]
    # PLACEHOLDER ENTITIES: sensor.printer_status_placeholder, sensor.printer_progress_placeholder
    label: |
      [[[
        const p = states['sensor.printer_progress_placeholder'];
        return p ? `${p.state}% remaining` : '';
      ]]]
    variables:
      badge_color: |
        [[[
          const s = states['sensor.printer_status_placeholder'];
          return (s && s.state === 'Printing') ? 'var(--kotapish-green)' : 'var(--kotapish-blue)';
        ]]]
    tap_action:
      action: more-info
      entity: sensor.printer_status_placeholder

  # ---------------------------------------------------------------------------
  # Spacer — pushes the clock + avatars + bell to the right, matching the
  # reference's pills-left / clock-and-avatars-right arrangement
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - flex: "1"
        - background: transparent
        - box-shadow: none
        - border: none
        - backdrop-filter: none

  # ---------------------------------------------------------------------------
  # Live clock — big numerals with a small live seconds readout, matching
  # the reference's "15:24" + small superscript seconds
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_glass_base
    show_name: false
    show_icon: false
    styles:
      card:
        - flex: "0 0 auto"
        - align-items: center
        - justify-content: center
        - padding: 12px 24px
        - background: transparent
        - box-shadow: none
        - border: none
        - backdrop-filter: none
    custom_fields:
      clock: |
        [[[
          const now = new Date();
          const time = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
          const seconds = now.getSeconds().toString().padStart(2, '0');
          return `<div style="font-family: var(--kotapish-font-family); display: flex; align-items: flex-start;">
            <span style="font-size: 34px; font-weight: 700; letter-spacing: -1px; color: var(--primary-text-color);">${time}</span>
            <span style="font-size: 14px; font-weight: 600; color: var(--secondary-text-color); margin-top: 2px;">${seconds}</span>
          </div>`;
        ]]]

  # ---------------------------------------------------------------------------
  # Person avatar pair — ported from the reference's own avatar+location-badge
  # pattern (a circular profile photo with a small colored location-icon
  # badge overlapping its corner). This project has no person-tracking
  # entities configured yet; PLACEHOLDER ENTITIES throughout.
  # ---------------------------------------------------------------------------
  - type: horizontal-stack
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - backdrop-filter: none
        - width: auto
    cards:
      - type: custom:button-card
        entity: person.resident_one_placeholder # PLACEHOLDER ENTITY
        show_entity_picture: true
        show_name: false
        show_state: false
        styles:
          card:
            - width: 35px
            - height: 35px
            - border-radius: "50%"
            - overflow: hidden
            - padding: 0
            - border: none
            - background: transparent
            - box-shadow: none
          entity_picture:
            - width: 100%
            - height: 100%
            - margin: 0

      - type: custom:button-card
        icon: mdi:map-marker
        # PLACEHOLDER ENTITY: sensor.resident_one_location_colour_placeholder
        show_name: false
        show_state: false
        show_icon: true
        styles:
          card:
            - width: 15px
            - height: 15px
            - border-radius: "50%"
            - margin-left: "-14px"
            - margin-top: 20px
            - border: none
            - background: |
                [[[
                  const s = states['sensor.resident_one_location_colour_placeholder'];
                  return s ? s.state : 'var(--kotapish-green)';
                ]]]
            - box-shadow: none
          icon:
            - width: "80%"
            - color: white

  # ---------------------------------------------------------------------------
  # Notifications bell — opens HA's persistent_notification panel via more-info
  # ---------------------------------------------------------------------------
  - type: custom:button-card
    template: kotapish_header_icon_button
    icon: mdi:bell-outline
    styles:
      card:
        - flex: "0 0 auto"
        - margin: 0 8px
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Notifications
          size: normal
          content:
            type: entities
            entities:
              - entity: persistent_notification.placeholder # PLACEHOLDER ENTITY
                name: System Notifications
