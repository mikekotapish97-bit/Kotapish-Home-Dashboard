# =============================================================================
# Popup: Patio
# Opened via Browser Mod from components/room_tiles.yaml. All entities below
# are PLACEHOLDERS — wire up to your real Patio devices.
# =============================================================================

type: vertical-stack
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:mushroom-title-card
    title: Patio
    subtitle: Deck lighting & weather

  - type: custom:mushroom-light-card
    entity: light.patio_placeholder # PLACEHOLDER ENTITY
    show_brightness_control: true
    use_light_color: true
    card_mod:
      style: |
        ha-card { --mush-control-height: 48px; padding: 16px 18px; }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Outside Temp
        secondary: "{{ states('sensor.patio_temp_placeholder') }}°" # PLACEHOLDER ENTITY
        icon: mdi:thermometer
        card_mod:
          style: |
            ha-card { padding: 14px 16px; }
            mushroom-shape-icon { --icon-color: var(--kotapish-orange); --shape-color: rgba(255,159,10,0.14); }

      - type: custom:mushroom-cover-card
        entity: cover.patio_awning_placeholder # PLACEHOLDER ENTITY
        show_buttons_control: true
        card_mod:
          style: |
            ha-card { padding: 14px 16px; }
            mushroom-shape-icon { --icon-color: var(--kotapish-teal); --shape-color: rgba(100,210,255,0.14); }

  - type: custom:mini-graph-card
    entities:
      - entity: sensor.patio_temp_placeholder # PLACEHOLDER ENTITY
        name: Temperature
        color: var(--kotapish-orange)
    hours_to_show: 24
    points_per_hour: 1
    line_width: 3
    show:
      labels: true
      legend: false
