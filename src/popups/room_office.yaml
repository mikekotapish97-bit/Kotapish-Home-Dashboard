# =============================================================================
# Popup: Office
# Opened via Browser Mod from components/room_tiles.yaml. All entities below
# are PLACEHOLDERS — wire up to your real Office devices.
# =============================================================================

type: vertical-stack
card_mod:
  style: |
    ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
cards:
  - type: custom:mushroom-title-card
    title: Office
    subtitle: Lights & desk equipment

  - type: custom:mushroom-light-card
    entity: light.office_placeholder # PLACEHOLDER ENTITY
    show_brightness_control: true
    show_color_control: true
    use_light_color: true
    collapsible_controls: false
    card_mod:
      style: |
        ha-card { --mush-control-height: 48px; padding: 16px 18px; }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Temperature
        secondary: "{{ states('sensor.office_temp_placeholder') }}°" # PLACEHOLDER ENTITY
        icon: mdi:thermometer
        card_mod:
          style: |
            ha-card { padding: 14px 16px; }
            mushroom-shape-icon { --icon-color: var(--kotapish-orange); --shape-color: rgba(255,159,10,0.14); }

      - type: custom:mushroom-entity-card
        entity: switch.office_desk_placeholder # PLACEHOLDER ENTITY
        primary_info: name
        secondary_info: state
        icon: mdi:desk-lamp
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card { padding: 14px 16px; }
            mushroom-shape-icon { --icon-color: var(--kotapish-blue); --shape-color: rgba(10,132,255,0.14); }

  - type: custom:mini-graph-card
    cache: false
    entities:
      - entity: sensor.office_temp_placeholder # PLACEHOLDER ENTITY
        name: Temperature
        color: var(--kotapish-orange)
    hours_to_show: 24
    points_per_hour: 1
    line_width: 3
    show:
      labels: true
      legend: false
