# =============================================================================
# Kotapish Home Dashboard — Root Lovelace Configuration
#
# This is the entry point. Install it as a YAML-mode dashboard, e.g. in
# configuration.yaml (2026-current syntax — do NOT put `mode: yaml` directly
# under the top-level `lovelace:` key, that form is deprecated/removed):
#
#   lovelace:
#     dashboards:
#       kotapish-home:
#         mode: yaml
#         title: Kotapish Home
#         icon: mdi:apple
#         show_in_sidebar: true
#         filename: kotapish-home-dashboard/src/dashboard.yaml
#
# Then reload: Developer Tools -> YAML -> Lovelace Dashboards (or restart HA).
# See ../INSTALLATION.md for the full step-by-step guide.
# =============================================================================

title: Kotapish Home
theme: kotapish_glass
background: var(--kotapish-page-background)

# -----------------------------------------------------------------------------
# Button Card templates — registered once, globally, at the dashboard root.
# Any custom:button-card anywhere in this project can now do:
#   template: [kotapish_glass_base, kotapish_room_tile]
# -----------------------------------------------------------------------------
button_card_templates: !include templates/button_card_templates.yaml

# -----------------------------------------------------------------------------
# Kiosk Mode (HACS) — hides header/sidebar ONLY for non-admin sessions.
# `admin_settings` is an explicit escape hatch: any account with the Home
# Assistant "Administrator" toggle enabled ALWAYS keeps the sidebar and
# header, on every device, so you can never get physically locked out of
# Settings on the wall iPad. Log the wall iPad in as a separate, non-admin
# "Wall Display" user for daily use — see INSTALLATION.md step 6 — and use
# your own admin account (on this iPad or any other device) to edit.
#
# `ignore_mobile_settings` / `ignore_entity_settings` are set explicitly on
# BOTH blocks: per the plugin's own docs, mobile-viewport detection and any
# per-entity override otherwise take priority over admin_settings and
# non_admin_settings — without these two flags a narrow/tablet-width
# browser window can silently override the "always show chrome for admins"
# guarantee above, regardless of who is signed in.
#
# HARD SAFETY NET (works regardless of any of the above): this plugin reads
# a `?disable_km` query-string parameter and turns itself off for that
# session no matter what the YAML says. If chrome ever disappears and you
# have no way back, add `?disable_km` to the end of the dashboard's URL
# and reload. See INSTALLATION.md step 6.
# -----------------------------------------------------------------------------
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
    hide_menubutton: true
    ignore_mobile_settings: true
    ignore_entity_settings: true
  admin_settings:
    hide_header: false
    hide_sidebar: false
    hide_menubutton: false
    ignore_mobile_settings: true
    ignore_entity_settings: true

# -----------------------------------------------------------------------------
# Views — one per nav rail destination. Order here MUST match the icon order
# in components/nav_rail.yaml (Home, Cameras, Climate, Lighting, Security,
# Energy, Media, Network, Commercial HVAC, Settings).
# -----------------------------------------------------------------------------
views:
  - !include pages/home.yaml
  - !include pages/cameras.yaml
  - !include pages/climate.yaml
  - !include pages/lighting.yaml
  - !include pages/security.yaml
  - !include pages/energy.yaml
  - !include pages/media.yaml
  - !include pages/network.yaml
  - !include pages/commercial_hvac.yaml
  - !include pages/settings.yaml
