# =============================================================================
# Kotapish Home Dashboard — Root Lovelace Configuration
#
# This is the entry point. Install it as a YAML-mode dashboard, e.g. in
# configuration.yaml (2026-current syntax — do NOT put `mode: yaml` directly
# under the top-level `lovelace:` key, that form is deprecated/removed):
#
#   lovelace:
#     dashboards:
#       kotapish-home:
#         mode: yaml
#         title: Kotapish Home
#         icon: mdi:apple
#         show_in_sidebar: true
#         filename: kotapish-home-dashboard/src/dashboard.yaml
#
# Then reload: Developer Tools -> YAML -> Lovelace Dashboards (or restart HA).
# See ../INSTALLATION.md for the full step-by-step guide.
# =============================================================================

title: Kotapish Home
theme: kotapish_glass
background: var(--kotapish-page-background)

# -----------------------------------------------------------------------------
# Button Card templates — registered once, globally, at the dashboard root.
# Any custom:button-card anywhere in this project can now do:
#   template: [kotapish_glass_base, kotapish_room_tile]
# -----------------------------------------------------------------------------
button_card_templates: !include templates/button_card_templates.yaml

# -----------------------------------------------------------------------------
# NOTE ON KIOSK MODE: this project intentionally does NOT use the Kiosk
# Mode HACS resource. Its `admin_settings`/`non_admin_settings` role-based
# hiding repeatedly failed to guarantee the Home Assistant sidebar/header
# stayed reachable, up to and including for admin accounts — and it's a
# long-archived, unmaintained project (the original `maykar/kiosk-mode`
# repo has been read-only since 2022, with HACS resolving to any of
# several forks of uncertain behavior). The HA sidebar/header are left
# fully visible here on purpose: reliability and always having a way back
# into Settings wins over a fully edge-to-edge look.
#
# The wall-mount "kiosk" experience instead comes entirely from iPadOS's
# own built-in Guided Access, which locks the iPad's hardware to this one
# Safari tab — see INSTALLATION.md step 6.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Views. Navigation is Home Assistant's native sidebar plus its automatic
# view-tabs strip (rendered from each view's `title`/`icon` below) — there
# is no custom nav rail (see components/nav_rail.yaml for why). Order here
# only controls the order of those tabs.
# -----------------------------------------------------------------------------
views:
  - !include pages/home.yaml
  - !include pages/cameras.yaml
  - !include pages/climate.yaml
  - !include pages/lighting.yaml
  - !include pages/security.yaml
  - !include pages/energy.yaml
  - !include pages/media.yaml
  - !include pages/network.yaml
  - !include pages/commercial_hvac.yaml
  - !include pages/settings.yaml
