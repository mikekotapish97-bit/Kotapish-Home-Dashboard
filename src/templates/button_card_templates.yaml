# =============================================================================
# Kotapish Home Dashboard — Button Card Templates
# Loaded into the root dashboard config as:
#   button_card_templates: !include_dir_merge_named ../templates_bc
# (dashboard.yaml merges this file's top-level keys — see comments below)
#
# Every custom:button-card in this project extends one of these templates via
# `template: [kotapish_glass_base, ...]`. This is the ONLY place card geometry,
# blur and base typography are defined for button-card — never redeclare
# border-radius/backdrop-filter ad-hoc in a page file.
# =============================================================================

kotapish_glass_base:
  show_name: true
  show_icon: true
  show_state: false
  styles:
    card:
      - border-radius: var(--kotapish-radius-xl)
      - background: var(--kotapish-glass-surface)
      - backdrop-filter: blur(var(--kotapish-glass-blur))
      - -webkit-backdrop-filter: blur(var(--kotapish-glass-blur))
      - border: 1px solid var(--kotapish-glass-border)
      - box-shadow: var(--kotapish-glass-shadow)
      - transition: var(--kotapish-transition-smooth)
      - padding: 12px
    name:
      - font-family: var(--kotapish-font-family)
      - font-weight: "600"
      - font-size: 16px
      - color: var(--primary-text-color)
    state:
      - font-family: var(--kotapish-font-family)
      - font-size: 13px
      - color: var(--secondary-text-color)
    icon:
      - color: var(--kotapish-blue)
      - width: 28px

# -----------------------------------------------------------------------------
# Left navigation rail icon — 80x80 touch target, active-state pill highlight
# -----------------------------------------------------------------------------
kotapish_nav_icon:
  template: kotapish_glass_base
  show_name: false
  show_label: true
  show_icon: true
  size: 26px
  styles:
    card:
      - width: 56px
      - height: 56px
      - border-radius: var(--kotapish-radius-m)
      # variables.path is the view's `path:` (e.g. "home"). Active state is
      # derived from the current URL so ONE shared nav_rail.yaml can be
      # included on every page and still self-highlight correctly.
      - background: |
          [[[
            return (window.location.pathname.indexOf('/' + variables.path) !== -1)
              ? 'var(--kotapish-blue)' : 'transparent';
          ]]]
      - box-shadow: none
      - border: none
      - margin: 0 auto
      - padding: 0
    icon:
      - color: |
          [[[
            return (window.location.pathname.indexOf('/' + variables.path) !== -1)
              ? 'white' : 'var(--secondary-text-color)';
          ]]]
      - width: 26px
    label:
      - font-family: var(--kotapish-font-family)
      - font-size: 10px
      - font-weight: "500"
      - color: |
          [[[
            return (window.location.pathname.indexOf('/' + variables.path) !== -1)
              ? 'var(--primary-text-color)' : 'var(--secondary-text-color)';
          ]]]
      - margin-top: 4px

# -----------------------------------------------------------------------------
# Large room tile (Home page bottom grid) — icon, name, live state, color wash
#
# Deliberately uses normal document flow (no position: absolute) — an
# earlier version pinned the icon to the top and the name/state to the
# bottom by fixed pixel offsets, which only avoided overlap if the card's
# actual rendered height matched the assumed `aspect-ratio`. Safari/iPadOS
# handles `aspect-ratio` inconsistently on flex containers, so the card
# sometimes rendered shorter than assumed and the bottom-pinned text landed
# on top of the icon. Stacking icon/name/state in normal flow can't overlap
# regardless of the card's actual height.
# -----------------------------------------------------------------------------
kotapish_room_tile:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_icon: true
  size: 32px
  styles:
    card:
      - justify-content: flex-start
      - align-items: flex-start
      - padding: 18px
      - min-height: 120px
      - gap: 6px
    icon:
      - color: var(--kotapish-blue)
      - width: 32px
    name:
      - font-size: 17px
      - font-weight: "700"
      - text-align: left
    state:
      - font-size: 13px
      - color: var(--secondary-text-color)
      - text-align: left

# -----------------------------------------------------------------------------
# Status tile — compact vertical tile used in the Home Status grid
# (garage/locks/alarm/etc), sized to match the reference dashboard's
# Shortcuts tiles (88px). Icon sits in a colored circular badge; the whole
# card background flips to a lighter, attention-drawing tint when the
# entity is in a state worth noticing (anything not "green"/normal) —
# matching the reference's tile-flips-color-when-active behavior. Icon,
# name and state stack in normal flow (no absolute positioning — see the
# note on kotapish_room_tile above for why that matters).
# -----------------------------------------------------------------------------
kotapish_status_chip:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_icon: true
  size: 24px
  styles:
    card:
      - justify-content: center
      - align-items: center
      - padding: 10px
      - height: 88px
      - gap: 6px
      - border-radius: var(--kotapish-radius-l)
      - background: |
          [[[
            return (variables.chip_color && variables.chip_color !== 'var(--kotapish-green)')
              ? 'rgba(255, 255, 255, 0.14)' : 'var(--kotapish-glass-surface)';
          ]]]
    icon:
      - width: 24px
      - color: white
      - background: |
          [[[ return variables.chip_color || 'var(--kotapish-blue)'; ]]]
      - border-radius: "50%"
      - padding: 9px
    name:
      - font-size: 13px
      - font-weight: "600"
      - text-align: center
    state:
      - font-size: 11px
      - color: var(--secondary-text-color)
      - text-align: center

# -----------------------------------------------------------------------------
# Camera selector pill (Entry / Driveway / Deck) — sized to match the
# reference dashboard's own camera_list pill (105x55px, 15px radius).
# -----------------------------------------------------------------------------
kotapish_camera_pill:
  template: kotapish_glass_base
  show_icon: true
  show_name: true
  show_state: false
  size: 16px
  styles:
    card:
      - flex-direction: row
      - justify-content: center
      - align-items: center
      - width: 105px
      - height: 55px
      - padding: 0 10px
      - gap: 6px
      - border-radius: var(--kotapish-radius-m)
      - background: |
          [[[
            return variables.selected ? 'var(--kotapish-blue)' : 'var(--kotapish-glass-surface)';
          ]]]
    name:
      - font-size: 13px
      - font-weight: "600"
      - color: |
          [[[ return variables.selected ? 'white' : 'var(--primary-text-color)'; ]]]
    icon:
      - width: 16px
      - color: |
          [[[ return variables.selected ? 'white' : 'var(--kotapish-blue)'; ]]]

# -----------------------------------------------------------------------------
# Header circular icon button (fullscreen, notifications)
# -----------------------------------------------------------------------------
kotapish_header_icon_button:
  template: kotapish_glass_base
  show_name: false
  show_state: false
  size: 20px
  styles:
    card:
      - width: 44px
      - height: 44px
      - border-radius: 50%
      - padding: 0
    icon:
      - color: var(--primary-text-color)
      - width: 20px

# -----------------------------------------------------------------------------
# BAS (Building Automation) point tile — Commercial HVAC page
# Denser, data-forward variant used for AHU/RTU/Boiler/Chiller points
# -----------------------------------------------------------------------------
kotapish_bas_point:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_label: true
  layout: icon_name_state
  size: 20px
  styles:
    card:
      - padding: 10px 14px
      - border-radius: var(--kotapish-radius-m)
      - align-items: flex-start
    name:
      - font-size: 12px
      - font-weight: "500"
      - color: var(--secondary-text-color)
      - justify-self: start
    state:
      - font-size: 20px
      - font-weight: "700"
      - justify-self: start
      - color: var(--primary-text-color)
    icon:
      - color: var(--kotapish-teal)
      - width: 18px

# -----------------------------------------------------------------------------
# BAS equipment header card — AHU-1 / RTU-2 / Boiler-1 title bar with run status
# -----------------------------------------------------------------------------
kotapish_bas_equipment_header:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_icon: true
  layout: icon_name_state2nd
  size: 26px
  styles:
    card:
      - flex-direction: row
      - justify-content: space-between
      - padding: 16px 20px
      - border-radius: var(--kotapish-radius-l)
    name:
      - font-size: 16px
      - font-weight: "700"
    state:
      - font-size: 13px
      - font-weight: "600"
      - color: |
          [[[
            return (entity && entity.state === 'on') ? 'var(--kotapish-green)' : 'var(--kotapish-red)';
          ]]]
    icon:
      - color: var(--kotapish-teal)

# -----------------------------------------------------------------------------
# Ghost / list-row button — a standalone glass card in a horizontal row
# layout, used for the Rooms list and Settings-style info rows. Stack
# several of these inside a plain `vertical-stack` — do NOT nest
# custom:button-card inside a core `type: entities` card's `entities:`
# list; that list only accepts simple entity-row configs
# (entity/name/icon/...), not full nested card configs, and Home Assistant
# will reject the whole dashboard config if you do.
#
# Icon sits in a small colored square badge (5px radius) — matches the
# reference dashboard's own room-row `img_cell` badge treatment. Pass
# `variables: {badge_color: ...}` per card to set its color; defaults to
# blue when omitted (e.g. the Settings page's info rows, which don't set one).
# -----------------------------------------------------------------------------
kotapish_list_row:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_icon: true
  layout: icon_name_state2nd
  size: 15px
  styles:
    card:
      - flex-direction: row
      - justify-content: space-between
      - padding: 14px 18px
    name:
      - font-size: 14px
      - font-weight: "500"
    state:
      - font-size: 13px
      - color: var(--secondary-text-color)
    icon:
      - width: 15px
      - color: white
      - background: |
          [[[ return variables.badge_color || 'var(--kotapish-blue)'; ]]]
      - border-radius: "5px"
      - padding: 4px

# -----------------------------------------------------------------------------
# Bottom status bar pill — horizontal, fully-rounded row used in the Home
# page's bottom status bar (lights/climate/media/garage). Matches the
# reference dashboard's own bottom-bar pill: 60px tall, radius 50px, icon
# in a colored circular badge on the left, name/state stacked to its right.
# -----------------------------------------------------------------------------
kotapish_bottom_bar_pill:
  template: kotapish_glass_base
  show_name: true
  show_state: true
  show_icon: true
  layout: icon_name_state2nd
  size: 20px
  styles:
    card:
      - flex-direction: row
      - justify-content: flex-start
      - align-items: center
      - height: 60px
      - padding: 0 18px
      - gap: 12px
      - border-radius: var(--kotapish-radius-pill)
    name:
      - font-size: 14px
      - font-weight: "600"
      - justify-self: start
    state:
      - font-size: 12px
      - color: var(--secondary-text-color)
    icon:
      - width: 20px
      - color: white
      - background: |
          [[[ return variables.badge_color || 'var(--kotapish-blue)'; ]]]
      - border-radius: "50%"
      - padding: 10px

# -----------------------------------------------------------------------------
# Assist voice button — circular pill matching the reference dashboard's
# bottom-bar microphone button. Uses HA's native Assist tap_action (built
# into core Home Assistant, no HACS component needed).
# -----------------------------------------------------------------------------
kotapish_assist_button:
  template: kotapish_glass_base
  show_name: true
  show_state: false
  layout: icon_name_state2nd
  size: 20px
  styles:
    card:
      - flex-direction: row
      - justify-content: center
      - align-items: center
      - height: 60px
      - width: 150px
      - padding: 0 18px
      - gap: 12px
      - border-radius: var(--kotapish-radius-pill)
    name:
      - font-size: 14px
      - font-weight: "600"
    icon:
      - width: 20px
      - color: white
      - background: var(--kotapish-blue)
      - border-radius: "50%"
      - padding: 10px

# -----------------------------------------------------------------------------
# Top bar status pill — 190x50px, matching the reference dashboard's own
# top-row notification pill exactly (verified against its real
# `update_cards` template): icon circle badge on the left, name (bold)
# stacked over a secondary label line on the right. grid-template-areas
# "i n" / "i l" uses button-card's own area codes (icon/name/label),
# copied directly from the reference's working config.
# -----------------------------------------------------------------------------
kotapish_top_pill:
  template: kotapish_glass_base
  show_name: true
  show_label: true
  show_icon: true
  show_state: false
  size: 18px
  styles:
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: min-content 1fr
      - align-items: center
    card:
      - width: 190px
      - height: 50px
      - padding: 0 15px 0 8px
      - border-radius: var(--kotapish-radius-pill)
    name:
      - justify-self: start
      - font-size: 13px
      - font-weight: "600"
    label:
      - justify-self: start
      - font-size: 11px
      - font-weight: "400"
      - color: var(--secondary-text-color)
    icon:
      - width: 18px
      - color: white
      - background: |
          [[[ return variables.badge_color || 'var(--kotapish-blue)'; ]]]
      - border-radius: "50%"
      - padding: 8px

# -----------------------------------------------------------------------------
# Room row — icon badge | name | (light-count pill + temperature), matching
# the reference dashboard's own room-row structure (three distinct visual
# elements per row, not one combined text string). The `info` custom_field
# name becomes its own grid area automatically (same mechanism already
# used by components/header.yaml's greeting/subline fields).
# -----------------------------------------------------------------------------
kotapish_room_row:
  template: kotapish_glass_base
  show_name: true
  show_icon: true
  show_state: false
  size: 15px
  styles:
    grid:
      - grid-template-areas: '"i n info"'
      - grid-template-columns: min-content 1fr min-content
      - align-items: center
    card:
      - padding: 12px 16px
    name:
      - justify-self: start
      - font-size: 14px
      - font-weight: "500"
    icon:
      - width: 15px
      - color: white
      - background: |
          [[[ return variables.badge_color || 'var(--kotapish-blue)'; ]]]
      - border-radius: "5px"
      - padding: 4px
