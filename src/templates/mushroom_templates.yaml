# -----------------------------------------------------------------------------
# Concrete, ready-to-use shape (mushroom-template-card) for compact entity
# rows used throughout Security / Network / Energy pages. YAML anchors do not
# survive across !include boundaries in Home Assistant, so this is a copy
# reference, not a live anchor — replicate this exact shape when adding rows.
# -----------------------------------------------------------------------------
kotapish_mushroom_entity_row:
  type: custom:mushroom-template-card
  primary: "{{ entity_name }}"
  secondary: "{{ entity_state }}"
  icon: "{{ entity_icon }}"
  layout: horizontal
  tap_action:
    action: more-info
  card_mod:
    style: |
      ha-card {
        --mush-icon-size: 40px;
        padding: 12px 16px;
      }
      mushroom-shape-icon {
        --icon-color: var(--kotapish-blue);
        --shape-color: rgba(10, 132, 255, 0.14);
      }
