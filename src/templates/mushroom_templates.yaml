# =============================================================================
# Kotapish Home Dashboard — Mushroom Card Conventions
#
# Mushroom cards have no native named-template engine (unlike button-card),
# so this file is the canonical REFERENCE COPY of the card_mod block every
# mushroom card in this project must carry. Copy it verbatim into any new
# mushroom-*-card you add — do not invent a second variant.
#
# Base blur/radius/border already comes for free from the theme's global
# `card-mod-card` hook (see theme/kotapish_glass.yaml). This file only
# controls mushroom-internal chrome: icon container shape, tap ripple,
# slider fill, spacing.
# =============================================================================

