# =============================================================================
# Page: Climate
# Thermostat (real: climate.t6_pro) + temperature/humidity graphs + outside
# temperature + full weather hero.
# =============================================================================

title: Climate
path: climate
icon: mdi:thermostat
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        name: Climate

      - type: horizontal-stack
        cards:
          # ------------------------------------------------------------------
          # Left column: Honeywell T6 Pro full control + humidity
          # ------------------------------------------------------------------
          - type: vertical-stack
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.t6_pro
                show_temperature_control: true
                hvac_modes:
                  - heat
                  - cool
                  - heat_cool
                  - "off"
                collapsible_controls: false
                card_mod:
                  style: |
                    ha-card { --mush-control-height: 64px; padding: 22px 24px; }
                    mushroom-shape-icon { --icon-color: var(--kotapish-orange); --shape-color: rgba(255,159,10,0.14); }

              - type: custom:mushroom-template-card
                primary: Humidity
                secondary: "{{ state_attr('climate.t6_pro', 'current_humidity') }}%"
                icon: mdi:water-percent
                card_mod:
                  style: |
                    ha-card { padding: 16px 20px; }
                    mushroom-shape-icon { --icon-color: var(--kotapish-teal); --shape-color: rgba(100,210,255,0.14); }

              - type: custom:mini-graph-card
                title: Indoor Temperature & Humidity
                entities:
                  - entity: climate.t6_pro
                    attribute: current_temperature
                    name: Temperature
                    color: var(--kotapish-orange)
                  - entity: climate.t6_pro
                    attribute: current_humidity
                    name: Humidity
                    color: var(--kotapish-teal)
                    y_axis: secondary
                hours_to_show: 48
                points_per_hour: 1
                line_width: 3
                show:
                  labels: true
                  legend: true

          # ------------------------------------------------------------------
          # Right column: Outside temperature + full weather hero
          # ------------------------------------------------------------------
          - type: vertical-stack
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
            cards:
              - type: custom:mushroom-template-card
                primary: Outside Temperature
                secondary: "{{ states('weather.kotapish_home_placeholder') }}" # PLACEHOLDER ENTITY
                icon: mdi:thermometer
                card_mod:
                  style: |
                    ha-card { padding: 16px 20px; }
                    mushroom-shape-icon { --icon-color: var(--kotapish-blue); --shape-color: rgba(10,132,255,0.14); }

              - !include ../components/weather_card.yaml

              - type: custom:mini-graph-card
                title: Outdoor Temperature Trend
                entities:
                  - entity: weather.kotapish_home_placeholder # PLACEHOLDER ENTITY
                    attribute: temperature
                    name: Outside
                    color: var(--kotapish-blue)
                hours_to_show: 48
                points_per_hour: 1
                line_width: 3
                show:
                  labels: true
                  legend: false
