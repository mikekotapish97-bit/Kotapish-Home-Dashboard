# =============================================================================
# Page: Energy
# Powerwall, Solar, Grid, Battery + energy graphs. All entities are
# PLACEHOLDERS — replace with your real Tesla Powerwall / solar integration.
# =============================================================================

title: Energy
path: energy
icon: mdi:lightning-bolt
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        name: Energy

      # -----------------------------------------------------------------------
      # Powerwall / Solar / Grid / Home load summary tiles
      # -----------------------------------------------------------------------
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Powerwall
            secondary: "{{ states('sensor.powerwall_charge_placeholder') }}%" # PLACEHOLDER ENTITY
            icon: mdi:battery-high
            card_mod:
              style: |
                ha-card { padding: 18px 20px; }
                mushroom-shape-icon { --icon-color: var(--kotapish-teal); --shape-color: rgba(100,210,255,0.14); }

          - type: custom:mushroom-template-card
            primary: Solar
            secondary: "{{ states('sensor.solar_power_placeholder') }} kW" # PLACEHOLDER ENTITY
            icon: mdi:solar-power
            card_mod:
              style: |
                ha-card { padding: 18px 20px; }
                mushroom-shape-icon { --icon-color: var(--kotapish-yellow); --shape-color: rgba(255,214,10,0.14); }

          - type: custom:mushroom-template-card
            primary: Grid
            secondary: "{{ states('sensor.grid_power_placeholder') }} kW" # PLACEHOLDER ENTITY
            icon: mdi:transmission-tower
            card_mod:
              style: |
                ha-card { padding: 18px 20px; }
                mushroom-shape-icon { --icon-color: var(--kotapish-purple); --shape-color: rgba(191,90,242,0.14); }

          - type: custom:mushroom-template-card
            primary: Home Load
            secondary: "{{ states('sensor.home_load_power_placeholder') }} kW" # PLACEHOLDER ENTITY
            icon: mdi:home-lightning-bolt
            card_mod:
              style: |
                ha-card { padding: 18px 20px; }
                mushroom-shape-icon { --icon-color: var(--kotapish-orange); --shape-color: rgba(255,159,10,0.14); }

      # -----------------------------------------------------------------------
      # Battery state of charge trend
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        cache: false
        title: Powerwall State of Charge
        entities:
          - entity: sensor.powerwall_charge_placeholder # PLACEHOLDER ENTITY
            name: Charge
            color: var(--kotapish-teal)
        hours_to_show: 48
        points_per_hour: 1
        line_width: 3
        show:
          labels: true
          legend: false

      # -----------------------------------------------------------------------
      # Solar / Grid / Home load 24h comparison
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        cache: false
        title: Solar, Grid & Home Load
        entities:
          - entity: sensor.solar_power_placeholder # PLACEHOLDER ENTITY
            name: Solar
            color: var(--kotapish-yellow)
          - entity: sensor.grid_power_placeholder # PLACEHOLDER ENTITY
            name: Grid
            color: var(--kotapish-purple)
          - entity: sensor.home_load_power_placeholder # PLACEHOLDER ENTITY
            name: Home Load
            color: var(--kotapish-orange)
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        show:
          labels: true
          legend: true
