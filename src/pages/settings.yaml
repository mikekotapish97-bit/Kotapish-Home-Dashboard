# =============================================================================
# Page: Settings
# Dashboard/system settings: Guided Access info, camera selector reset,
# theme info. The HA sidebar/header are always visible on this dashboard —
# see the note in dashboard.yaml for why Kiosk Mode is deliberately not used.
# =============================================================================

title: Settings
path: settings
icon: mdi:cog
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        name: Settings

      # -----------------------------------------------------------------------
      # Wall-mount controls
      #
      # This project does NOT use the Kiosk Mode HACS resource — see the
      # note at the top of dashboard.yaml for why. The HA sidebar/header
      # are always visible; the wall-mounted "kiosk" feel instead comes
      # from iPadOS's own Guided Access, which is a physical, OS-level
      # lock with no dependency on any frontend plugin's config being
      # correct. These rows are purely informational.
      #
      # NOTE: this is a plain vertical-stack of standalone glass cards, NOT
      # a core `type: entities` card. The `entities:` card's own list only
      # accepts simple entity-row configs (entity/name/icon/...) — nesting
      # full `type: custom:button-card` configs in there is invalid and
      # will make Home Assistant reject the ENTIRE dashboard config with a
      # generic "Configuration error", on every view, not just this one.
      # -----------------------------------------------------------------------
      - type: vertical-stack
        card_mod:
          style: |
            ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
        cards:
          - type: custom:button-card
            template: kotapish_glass_base
            show_name: false
            show_icon: false
            styles:
              card:
                - padding: 4px 20px
                - align-items: flex-start
            name: Wall Display

          - type: custom:button-card
            template: kotapish_list_row
            icon: mdi:tablet-dashboard
            name: Guided Access
            state_display: iPadOS setting — see INSTALLATION.md
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Guided Access
                  size: normal
                  content:
                    type: markdown
                    content: >-
                      This dashboard intentionally leaves the Home
                      Assistant sidebar and header **always visible** —
                      no frontend plugin hides it, so there is never a
                      risk of being locked out.


                      The wall-mounted, single-app "kiosk" feel comes
                      from **iPadOS Guided Access** instead: **Settings →
                      Accessibility → Guided Access**, enable it, then
                      triple-click the side button while this dashboard
                      is open in Safari to lock the iPad to this one tab.
                      Triple-click again and enter your passcode to exit.


                      See `INSTALLATION.md` step 6 for the full setup.

          - type: custom:button-card
            template: kotapish_list_row
            icon: mdi:screen-rotation-lock
            name: Force Landscape
            state_display: iPad Pro 12.9"
            tap_action:
              action: none

          - type: custom:button-card
            template: kotapish_list_row
            icon: mdi:brightness-6
            name: Idle Screensaver
            state_display: Off
            tap_action:
              action: none

      # -----------------------------------------------------------------------
      # Camera + input helpers reset
      # -----------------------------------------------------------------------
      - type: entities
        title: Dashboard Data
        show_header_toggle: false
        entities:
          - entity: input_select.dashboard_camera
            name: Active Camera Selector
          - entity: camera.entry_cam
            name: Entry Camera
          - entity: climate.t6_pro
            name: Honeywell T6 Pro
        card_mod:
          style: |
            ha-card { padding: 8px 20px; }

      # -----------------------------------------------------------------------
      # About
      # -----------------------------------------------------------------------
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        custom_fields:
          about: |
            [[[
              return `<div style="font-family: var(--kotapish-font-family);">
                <div style="font-size:17px; font-weight:700; color:var(--primary-text-color);">Kotapish Home Dashboard</div>
                <div style="font-size:13px; color:var(--secondary-text-color); margin-top:4px;">Version 1.0.0 · Built for iPad Pro 12.9" · Home Assistant 2026</div>
              </div>`;
            ]]]
