# =============================================================================
# Page: Lighting
# Room-by-room light control grid + scene shortcuts. All light entities are
# PLACEHOLDERS — replace with your real light/group entities.
# =============================================================================

title: Lighting
path: lighting
icon: mdi:lightbulb
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        name: Lighting

      # -----------------------------------------------------------------------
      # Scenes — quick whole-home moods
      # -----------------------------------------------------------------------
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: kotapish_glass_base
            icon: mdi:weather-sunny
            name: Bright
            size: 28px
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.lighting_bright_placeholder # PLACEHOLDER ENTITY

          - type: custom:button-card
            template: kotapish_glass_base
            icon: mdi:weather-night
            name: Relax
            size: 28px
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.lighting_relax_placeholder # PLACEHOLDER ENTITY

          - type: custom:button-card
            template: kotapish_glass_base
            icon: mdi:movie-open
            name: Movie
            size: 28px
            tap_action:
              action: call-service
              service: scene.turn_on
              service_data:
                entity_id: scene.lighting_movie_placeholder # PLACEHOLDER ENTITY

          - type: custom:button-card
            template: kotapish_glass_base
            icon: mdi:power
            name: All Off
            size: 28px
            tap_action:
              action: call-service
              service: light.turn_off
              service_data:
                entity_id: all

      # -----------------------------------------------------------------------
      # Room-by-room light control
      # -----------------------------------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.living_room_placeholder # PLACEHOLDER ENTITY
            name: Living Room
            show_brightness_control: true
            show_color_control: true
            use_light_color: true

          - type: custom:mushroom-light-card
            entity: light.kitchen_placeholder # PLACEHOLDER ENTITY
            name: Kitchen
            show_brightness_control: true
            show_color_control: true
            use_light_color: true

          - type: custom:mushroom-light-card
            entity: light.bedroom_placeholder # PLACEHOLDER ENTITY
            name: Bedroom
            show_brightness_control: true
            show_color_control: true
            use_light_color: true

          - type: custom:mushroom-light-card
            entity: light.office_placeholder # PLACEHOLDER ENTITY
            name: Office
            show_brightness_control: true
            show_color_control: true
            use_light_color: true

          - type: custom:mushroom-light-card
            entity: light.garage_placeholder # PLACEHOLDER ENTITY
            name: Garage
            show_brightness_control: true

          - type: custom:mushroom-light-card
            entity: light.patio_placeholder # PLACEHOLDER ENTITY
            name: Patio
            show_brightness_control: true
            use_light_color: true
