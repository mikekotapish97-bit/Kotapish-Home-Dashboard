# =============================================================================
# Page: Commercial HVAC (Building Automation)
# Designed for a BAS/controls programmer, not a homeowner. Dense data tiles,
# equipment run-status headers, BACnet/Niagara supervisory status, schedules
# and trends. Every entity below is a PLACEHOLDER — map to your real BACnet/
# Niagara JACE points (via the BACnet or MQTT integration) before use.
# =============================================================================

title: Commercial HVAC
path: commercial-hvac
icon: mdi:hvac
type: custom:grid-layout
layout:
  grid-template-columns: var(--kotapish-nav-width) 1fr
  grid-template-rows: 1fr
  grid-template-areas: '"nav main"'
  mediaquery:
    "(max-width: 900px)":
      grid-template-columns: 1fr
      grid-template-areas: '"main"'
cards:
  - !include ../components/nav_rail.yaml

  - type: custom:grid-layout
    view_layout:
      grid-area: main
    layout:
      grid-template-columns: "1fr"
      grid-template-rows: repeat(8, auto)
      grid-gap: var(--kotapish-gutter)
      margin: var(--kotapish-gutter)
    cards:
      - type: custom:button-card
        template: kotapish_glass_base
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 20px 26px
            - align-items: flex-start
        name: Commercial HVAC — Building Automation

      # -----------------------------------------------------------------------
      # Supervisory layer status: BACnet gateway, Niagara, JACE controller
      # -----------------------------------------------------------------------
      - type: custom:grid-layout
        layout:
          grid-template-columns: repeat(3, 1fr)
          grid-gap: var(--kotapish-gutter)
          mediaquery:
            "(max-width: 1000px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:button-card
            template: kotapish_bas_equipment_header
            entity: binary_sensor.bacnet_gateway_status_placeholder # PLACEHOLDER ENTITY
            icon: mdi:server-network
            name: BACnet Gateway
            state_display: "[[[ return states['binary_sensor.bacnet_gateway_status_placeholder'].state === 'on' ? 'Online' : 'Offline'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_equipment_header
            entity: binary_sensor.niagara_status_placeholder # PLACEHOLDER ENTITY
            icon: mdi:sitemap
            name: Niagara Framework
            state_display: "[[[ return states['binary_sensor.niagara_status_placeholder'].state === 'on' ? 'Online' : 'Offline'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_equipment_header
            entity: binary_sensor.jace_status_placeholder # PLACEHOLDER ENTITY
            icon: mdi:chip
            name: JACE Controller
            state_display: "[[[ return states['binary_sensor.jace_status_placeholder'].state === 'on' ? 'Online' : 'Offline'; ]]]"

      # -----------------------------------------------------------------------
      # AHU-1 — Air Handling Unit
      # -----------------------------------------------------------------------
      - type: custom:button-card
        template: kotapish_bas_equipment_header
        entity: binary_sensor.ahu_1_fan_status_placeholder # PLACEHOLDER ENTITY
        icon: mdi:fan
        name: AHU-1 — Air Handling Unit
        state_display: "[[[ return states['binary_sensor.ahu_1_fan_status_placeholder'].state === 'on' ? 'Running' : 'Stopped'; ]]]"

      - type: custom:grid-layout
        layout:
          grid-template-columns: repeat(6, 1fr)
          grid-gap: 12px
          mediaquery:
            "(max-width: 1200px)":
              grid-template-columns: repeat(3, 1fr)
        cards:
          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.ahu_1_supply_air_temp_placeholder # PLACEHOLDER ENTITY
            icon: mdi:thermometer
            name: Supply Air
            state_display: "[[[ return states['sensor.ahu_1_supply_air_temp_placeholder'].state + '°F'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.ahu_1_return_air_temp_placeholder # PLACEHOLDER ENTITY
            icon: mdi:thermometer
            name: Return Air
            state_display: "[[[ return states['sensor.ahu_1_return_air_temp_placeholder'].state + '°F'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.ahu_1_mixed_air_temp_placeholder # PLACEHOLDER ENTITY
            icon: mdi:thermometer-lines
            name: Mixed Air
            state_display: "[[[ return states['sensor.ahu_1_mixed_air_temp_placeholder'].state + '°F'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.ahu_1_static_pressure_placeholder # PLACEHOLDER ENTITY
            icon: mdi:gauge
            name: Static Pressure
            state_display: "[[[ return states['sensor.ahu_1_static_pressure_placeholder'].state + ' in.wc'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.ahu_1_damper_position_placeholder # PLACEHOLDER ENTITY
            icon: mdi:valve
            name: Damper Position
            state_display: "[[[ return states['sensor.ahu_1_damper_position_placeholder'].state + '%'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: binary_sensor.zone_1_occupancy_placeholder # PLACEHOLDER ENTITY
            icon: mdi:account-check
            name: Occupancy
            state_display: "[[[ return states['binary_sensor.zone_1_occupancy_placeholder'].state === 'on' ? 'Occupied' : 'Unoccupied'; ]]]"

      # -----------------------------------------------------------------------
      # RTU-1 — Rooftop Unit
      # -----------------------------------------------------------------------
      - type: custom:button-card
        template: kotapish_bas_equipment_header
        entity: binary_sensor.rtu_1_fan_status_placeholder # PLACEHOLDER ENTITY
        icon: mdi:fan
        name: RTU-1 — Rooftop Unit
        state_display: "[[[ return states['binary_sensor.rtu_1_fan_status_placeholder'].state === 'on' ? 'Running' : 'Stopped'; ]]]"

      - type: custom:grid-layout
        layout:
          grid-template-columns: repeat(6, 1fr)
          grid-gap: 12px
          mediaquery:
            "(max-width: 1200px)":
              grid-template-columns: repeat(3, 1fr)
        cards:
          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.rtu_1_supply_air_temp_placeholder # PLACEHOLDER ENTITY
            icon: mdi:thermometer
            name: Supply Air
            state_display: "[[[ return states['sensor.rtu_1_supply_air_temp_placeholder'].state + '°F'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.rtu_1_return_air_temp_placeholder # PLACEHOLDER ENTITY
            icon: mdi:thermometer
            name: Return Air
            state_display: "[[[ return states['sensor.rtu_1_return_air_temp_placeholder'].state + '°F'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.rtu_1_economizer_damper_placeholder # PLACEHOLDER ENTITY
            icon: mdi:valve
            name: Economizer Damper
            state_display: "[[[ return states['sensor.rtu_1_economizer_damper_placeholder'].state + '%'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.rtu_1_cooling_valve_placeholder # PLACEHOLDER ENTITY
            icon: mdi:pipe-valve
            name: Cooling Valve
            state_display: "[[[ return states['sensor.rtu_1_cooling_valve_placeholder'].state + '%'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.vfd_1_speed_placeholder # PLACEHOLDER ENTITY
            icon: mdi:speedometer
            name: VFD-1 Speed
            state_display: "[[[ return states['sensor.vfd_1_speed_placeholder'].state + '%'; ]]]"

          - type: custom:button-card
            template: kotapish_bas_point
            entity: sensor.vfd_1_current_placeholder # PLACEHOLDER ENTITY
            icon: mdi:current-ac
            name: VFD-1 Current
            state_display: "[[[ return states['sensor.vfd_1_current_placeholder'].state + ' A'; ]]]"

      # -----------------------------------------------------------------------
      # Boiler-1 & Chiller-1
      # -----------------------------------------------------------------------
      - type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: var(--kotapish-gutter)
          mediaquery:
            "(max-width: 1000px)":
              grid-template-columns: 1fr
        cards:
          - type: vertical-stack
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
            cards:
              - type: custom:button-card
                template: kotapish_bas_equipment_header
                entity: binary_sensor.boiler_1_run_status_placeholder # PLACEHOLDER ENTITY
                icon: mdi:water-boiler
                name: Boiler-1
                state_display: "[[[ return states['binary_sensor.boiler_1_run_status_placeholder'].state === 'on' ? 'Firing' : 'Standby'; ]]]"
              - type: custom:grid-layout
                layout:
                  grid-template-columns: repeat(2, 1fr)
                  grid-gap: 12px
                cards:
                  - type: custom:button-card
                    template: kotapish_bas_point
                    entity: sensor.boiler_1_supply_water_temp_placeholder # PLACEHOLDER ENTITY
                    icon: mdi:thermometer
                    name: Supply Water
                    state_display: "[[[ return states['sensor.boiler_1_supply_water_temp_placeholder'].state + '°F'; ]]]"
                  - type: custom:button-card
                    template: kotapish_bas_point
                    entity: sensor.boiler_1_return_water_temp_placeholder # PLACEHOLDER ENTITY
                    icon: mdi:thermometer
                    name: Return Water
                    state_display: "[[[ return states['sensor.boiler_1_return_water_temp_placeholder'].state + '°F'; ]]]"

          - type: vertical-stack
            card_mod:
              style: |
                ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
            cards:
              - type: custom:button-card
                template: kotapish_bas_equipment_header
                entity: binary_sensor.chiller_1_run_status_placeholder # PLACEHOLDER ENTITY
                icon: mdi:snowflake
                name: Chiller-1
                state_display: "[[[ return states['binary_sensor.chiller_1_run_status_placeholder'].state === 'on' ? 'Running' : 'Standby'; ]]]"
              - type: custom:grid-layout
                layout:
                  grid-template-columns: repeat(2, 1fr)
                  grid-gap: 12px
                cards:
                  - type: custom:button-card
                    template: kotapish_bas_point
                    entity: sensor.chiller_1_chw_supply_temp_placeholder # PLACEHOLDER ENTITY
                    icon: mdi:thermometer
                    name: CHW Supply
                    state_display: "[[[ return states['sensor.chiller_1_chw_supply_temp_placeholder'].state + '°F'; ]]]"
                  - type: custom:button-card
                    template: kotapish_bas_point
                    entity: sensor.chiller_1_chw_return_temp_placeholder # PLACEHOLDER ENTITY
                    icon: mdi:thermometer
                    name: CHW Return
                    state_display: "[[[ return states['sensor.chiller_1_chw_return_temp_placeholder'].state + '°F'; ]]]"

      # -----------------------------------------------------------------------
      # Schedules — occupancy schedule helpers
      # -----------------------------------------------------------------------
      - type: entities
        title: Schedules
        show_header_toggle: false
        entities:
          - entity: input_boolean.hvac_schedule_occupied_placeholder # PLACEHOLDER ENTITY
            name: Building Occupied Schedule
          - entity: input_datetime.hvac_schedule_start_placeholder # PLACEHOLDER ENTITY
            name: Occupied Start
          - entity: input_datetime.hvac_schedule_end_placeholder # PLACEHOLDER ENTITY
            name: Occupied End
        card_mod:
          style: |
            ha-card { padding: 8px 20px; }

      # -----------------------------------------------------------------------
      # Trends — cross-equipment supply air temperature comparison
      # -----------------------------------------------------------------------
      - type: custom:mini-graph-card
        title: Supply Air Trends — AHU-1 vs RTU-1
        entities:
          - entity: sensor.ahu_1_supply_air_temp_placeholder # PLACEHOLDER ENTITY
            name: AHU-1 Supply
            color: var(--kotapish-teal)
          - entity: sensor.rtu_1_supply_air_temp_placeholder # PLACEHOLDER ENTITY
            name: RTU-1 Supply
            color: var(--kotapish-blue)
          - entity: sensor.ahu_1_static_pressure_placeholder # PLACEHOLDER ENTITY
            name: AHU-1 Static Pressure
            color: var(--kotapish-purple)
            y_axis: secondary
        hours_to_show: 24
        points_per_hour: 4
        line_width: 2
        show:
          labels: true
          legend: true
