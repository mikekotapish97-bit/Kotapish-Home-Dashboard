# =============================================================================
# Page: Home
# Layout (single column, top to bottom):
#   1. Header (greeting, clock, date, weather chip, notifications)
#   2. Camera hero (full width)
#   3. Home Status row (Garage/Locks/Alarm/Internet/Powerwall)
#   4. Weather forecast card (Ranson, WV — current conditions + daily/weekly)
#   5. Thermostat (Honeywell T6 Pro)
#   6. Room tiles (Living Room, Kitchen, Bedroom, Office, Garage, Patio)
#
# Navigation is HA's native sidebar + the automatic view-tabs strip — this
# project no longer ships a custom nav rail (see components/nav_rail.yaml
# for why). `panel: true` gives this view's single card the full content
# width with no HA-imposed max-width/masonry column splitting.
# =============================================================================

title: Home
path: home
icon: mdi:home
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - !include ../components/header.yaml
      - !include ../components/camera_card.yaml
      - !include ../components/home_status_card.yaml
      - !include ../components/weather_forecast_card.yaml
      - !include ../components/thermostat_card.yaml
      - !include ../components/room_tiles.yaml
