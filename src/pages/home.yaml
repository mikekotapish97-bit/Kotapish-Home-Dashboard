# =============================================================================
# Page: Home
# Layout:
#   1. Header (greeting, clock, date, weather, notifications)
#   2. Camera hero (left, 2/3) + Thermostat & Home Status (right, 1/3)
#   3. Room tiles (Living Room, Kitchen, Bedroom, Office, Garage, Patio)
#
# Navigation is HA's native sidebar + the automatic view-tabs strip — this
# project no longer ships a custom nav rail (see components/nav_rail.yaml
# for why). `panel: true` gives this view's single card the full content
# width with no HA-imposed max-width/masonry column splitting.
# =============================================================================

title: Home
path: home
icon: mdi:home
panel: true
cards:
  - type: vertical-stack
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
    cards:
      - !include ../components/header.yaml

      - type: horizontal-stack
        card_mod:
          style: |
            ha-card { background: transparent; box-shadow: none; border: none; backdrop-filter: none; }
        cards:
          - !include ../components/camera_card.yaml
          - !include ../components/thermostat_card.yaml

      - !include ../components/room_tiles.yaml
