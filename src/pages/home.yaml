# =============================================================================
# Page: Home
# Uses Home Assistant's native `type: sections` view (not a hand-rolled
# vertical-stack of horizontal-stacks) — the same modern grid-based layout
# the reference dashboard is built on. HA handles the responsive column
# fitting natively here, which is more robust than manual flex nesting.
#
# max_columns: 12 gives fine-grained width control per section via
# column_span. Layout, top to bottom:
#   1. Header section (full width, column_span: 12)
#   2. Main row (column_span 5/4/3 = 12): Camera | Weather | Thermostat
#   3. Bottom row (column_span 4/4/4 = 12): Rooms | Home Status | Calendar
#
# Each component file carries its own `grid_options: {columns: full}` at
# its top level (not added here) so it fills its section's width instead
# of a narrow default slot — verified against a real working `sections`
# config, since HA's public schema docs don't fully spell this out.
#
# Navigation is HA's native sidebar + the automatic view-tabs strip — this
# project no longer ships a custom nav rail (see components/nav_rail.yaml
# for why).
# =============================================================================

title: Home
path: home
icon: mdi:home
type: sections
max_columns: 12
sections:
  - type: grid
    column_span: 12
    cards:
      - !include ../components/header.yaml

  - type: grid
    column_span: 5
    cards:
      - !include ../components/camera_card.yaml

  - type: grid
    column_span: 4
    cards:
      - !include ../components/weather_forecast_card.yaml

  - type: grid
    column_span: 3
    cards:
      - !include ../components/thermostat_card.yaml

  - type: grid
    column_span: 4
    cards:
      - !include ../components/rooms_list.yaml

  - type: grid
    column_span: 4
    cards:
      - !include ../components/home_status_card.yaml

  - type: grid
    column_span: 4
    cards:
      - !include ../components/calendar_card.yaml
